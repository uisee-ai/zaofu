# ZaoFu PRD workflow configuration v5.0.0.
#
# This is the versioned PRD controller for the 194 + 195 runtime contract:
# plan/task-map admission stays semantic, the blocking Task Pipeline owns
# stage dispatch, and workers receive an immutable execution envelope.
# The repository root zf.yaml remains the thin compatibility default.
apiVersion: zaofu.dev/v1
kind: PrdFlow
metadata:
  name: zaofu-prd/v5-production
  version: "5.0.0"
spec:
  flowProfile: prd-flow-v4-task-pipeline
  topology: fanout
  lanes: 8
  backend: codex
  roleDefaults:
    model_reasoning_effort: high
    contextWindowTokens: ${ZF_CODEX_CONTEXT_WINDOW_TOKENS:-200000}
  prdRef: ${ZF_PRD_REF:-docs/prd/TODO.md}
  targetRoot: .
  qualityFloor: product-demo
  evidencePolicy: strict_refs
  deliveryPolicy: ship_candidate
  artifactPackageMode: blocking
  productAcceptanceMode: blocking
  semanticSubmitProfiles:
    workflow-read: blocking
    plan-synth: blocking
    implementation: blocking
    task-verify: blocking
    candidate-verify: blocking
    thin-judge-goal-closure: blocking
  taskPipeline:
    # Production C route: WRC owns the normal frontier. Shadow observation
    # belongs to a separate canary controller and must not be enabled by an
    # environment override on the production profile.
    mode: blocking
    maxActiveTaskPipelines: 16
    maxReworkAttempts: 2
    pools:
      impl:
        capacity: 8
        roleInstances: [dev-lane-0, dev-lane-1, dev-lane-2, dev-lane-3, dev-lane-4, dev-lane-5, dev-lane-6, dev-lane-7]
      verify:
        capacity: 8
        roleInstances: [verify-lane-0, verify-lane-1, verify-lane-2, verify-lane-3, verify-lane-4, verify-lane-5, verify-lane-6, verify-lane-7]
    backpressure:
      maxUnverifiedTasks: 8
      maxIntegrationQueue: 2
    workerLifecycle:
      mode: on_demand
      idleSeconds: 120
    affinity:
      implRework: prefer_previous_session
      verifyIndependence: different_role
      sessionBinding: task_stage
      crossTaskContext: fresh
    integrationAdmission:
      default: verify_admitted
      riskReview:
        enabled: false
    candidate:
      integration: incremental_serial_cas
      integrationCapacity: 1
      rollingSmoke: required
      incrementalEvent: integration.queue.integrated
      freezeEvent: candidate.ready
      deliveryEvent: run.delivery.completed
      partialCandidateAutoShip: forbidden
      finalVerifyTarget: frozen_exact_commit
---
apiVersion: zaofu.dev/v1
kind: ZfConfig
metadata:
  name: zaofu-prd-v5-production
  zaofu:
    catalog:
      id: zaofu-prd-v5-production-codex
      label: ZaoFu PRD Workflow v5 Production (Codex)
      description: Production PRD controller with WRC blocking frontier, bounded OA checkpoints, and worker execution envelopes.
      intent: build
      backend: codex
      roles: 29
      assembly: project-bound-v1
      recommended_for: [build, prd]
      preferred: true
      order: 160
spec:
  profile_sources:
    - examples/prod/controller/common/profiles.yaml
  uses: [prod-runtime/v1, kanban-collaboration/v1]
  version: "5.0"
  project:
    name: zaofu
    state_dir: .zf
  orchestrator:
    backend: codex
    max_turns: 80
    wake_min_interval_s: 5
  roles:
    # OA owns semantic checkpoints and re-planning proposals. Kernel/WRC owns
    # normal frontier dispatch, leases, workspace, evidence, and terminal state.
    - name: orchestrator
      instance_id: orchestrator
      role_kind: reader
      backend: codex
      model_reasoning_effort: high
      context_window_tokens: ${ZF_CODEX_CONTEXT_WINDOW_TOKENS:-200000}
      permission_mode: bypass
      transport: tmux
      execution:
        default_profile: bounded-direct-v1
        profile_allowlist: [bounded-direct-v1]
      lifecycle:
        mode: resident
      stuck_threshold_seconds: 900
      spawn_ready_timeout_seconds: 240
      triggers:
        - dispatch.silent_stall
        - orchestrator.rework.triage.requested
        - orchestrator.semantic.checkpoint.requested
      publishes: [orchestrator.rework.triage.recorded]
      skills: [zf-yoke-orchestrator-role-context, zf-harness-state-sync]
  skill_sources:
    - name: zaofu-skills
      path: skills
      mode: readonly
  quality_gates:
    static:
      enabled: true
      required_checks:
        - python3 -m compileall -q src tests
        - npm --prefix web run typecheck
  runtime:
    web_terminal:
      enabled: true
      provider_start_timeout_seconds: 90
    workdirs:
      provision_paths: [.venv, web/node_modules]
    run_manager:
      backend: codex
    git:
      candidate_base_ref: dev
      ship_target_branch: dev
      auto_ship_on_judge_passed: false
  workflow:
    harness_profile: strict
    # Plan admission remains automatic; enable this explicitly when an
    # operator approval gate is required for a particular deployment.
    plan_approval: false
    candidate_quality_source: task_contract_required
    impl_self_check_required: true
    orchestration:
      oa_profile: orchestrator
      normal_frontier_owner: wrc
      mode: exception_advisor
      max_plan_revisions: 2
      no_progress_limit: 2
      flow_policies:
        prd:
          mode: semantic_control
          pilot_id: oa-wrc-prd-v5
          checkpoints: [pre_impl, semantic_failure]
          checkpoint_policies:
            pre_impl: blocking
            semantic_failure: blocking
          autonomous_actions: [delegate, continue, rework]
          review_blocked_tasks: true
        research:
          mode: exception_advisor
        workflow:
          mode: exception_advisor
    kind_routes:
      prd:
        pattern_id: prd-scan
        default_tier: standard
    dag:
      external_triggers: [prd.requested]
    admission_replan:
      enabled: true
      resynth_trigger: prd.scan.completed
    completion_audit:
      enabled: true
      provider_completed_state: completed_unverified
    resume_packet:
      enabled: true
      max_tokens: 1600
      generate_on:
        - dispatch
        - retry
        - context_recovery
        - worker.context.warning
        - worker.context.critical
        - worker.stuck
    rework_routing:
      prd.scan.failed: planner
      prd.plan.failed: planner
      integration.failed: dev-lane-0
      static_gate.failed: dev-lane-0
      test.failed: dev-lane-0
