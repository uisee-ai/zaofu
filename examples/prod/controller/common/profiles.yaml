apiVersion: zaofu.dev/v1
kind: ConfigProfile
metadata:
  name: prod-runtime/v1
spec:
  goal:
    enabled: true
    max_rescans: 5
    idle_progress_ticks: 3
    rework_fingerprint: true
    quiescent_after_escalate: true
    micro_loop: false
  # 2026-07-08 起只用仓内两目录:skills/(zf-* 边界/合约技能,本 source)
  # + yoke/(方法论族,经 wrapper dependencies 闭包或 bundle 直名走
  # yoke overlay 解析,无需声明 source)。外部 agent-skills 基线已 1v1
  # 核实由 yoke 族与 kernel 机械化覆盖后退役。
  skill_sources:
  - {name: zaofu-skills, path: ../../../skills, mode: readonly}
  flow_defaults:
    # bundle 只声明角色 wrapper + flow/project delta。机械合同经 wrapper
    # dependencies 物化为 load-on-demand reference；Judge 保持单一 Thin Judge。
    issue:
      roleDefaults: &long-horizon-role-defaults
        permission_mode: bypass
        stuck_threshold_seconds: 900
        spawn_ready_timeout_seconds: 240
        execution:
          default_profile: bounded-direct-v1
          profile_allowlist: [bounded-direct-v1]
        lifecycle:
          mode: on_demand
      roleSkillBundles:
        issue-triage: [debugging-triage, source-verification, zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-issue-plan-synth, zf-yoke-planner-role-context]
        plan-critic: [zf-workflow-adaptation-boundary, zf-yoke-critic-role-context]
        discovery: [zf-verify-rescan-replan, zf-goal-closure-replan-contract, zf-yoke-test-evaluator-role-context]
        judge-issue: [zf-goal-closure-judge-contract]
        fix: [zf-yoke-dev-worker-role-context]
        verify: [zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-yoke-test-evaluator-role-context]
    prd:
      roleDefaults: *long-horizon-role-defaults
      roleSkillBundles:
        scan: [source-verification, context-hygiene, zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-prd-plan-synth, zf-yoke-planner-role-context]
        planner: [zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-prd-plan-synth, zf-yoke-planner-role-context]
        plan-critic: [zf-workflow-adaptation-boundary, zf-yoke-critic-role-context]
        discovery: [zf-verify-rescan-replan, zf-goal-closure-replan-contract, zf-yoke-test-evaluator-role-context]
        judge-prd: [zf-goal-closure-judge-contract]
        impl: [zf-yoke-dev-worker-role-context]
        verify: [zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-yoke-test-evaluator-role-context]
  runtime:
    skills:
      # 2026-07-08:prod 预设 fail-closed——启用技能缺失/依赖断裂在
      # validate/start 前暴露,不再静默降级(需要本机可解析 skill_sources)。
      strict: true
      materialize: copy
    workdirs:
      enabled: true
      mode: worktree
    run_manager:
      backend: codex
      resident_agent:
        enabled: true
        session_mode: dedicated
    autoresearch_resident:
      enabled: true
      interval_seconds: 10
      max_actions_per_tick: 1
    # Lifecycle is wired into `zf start`, but remains opt-in because credentials
    # and chat routing are project-local adapter concerns (`feishu.yaml`).
    feishu_inbound:
      enabled: ${ZF_FEISHU_INBOUND_ENABLED:-false}
      mode: bridge
      require_routing: true
  # 执法档:flowProfile 展开默认 canonical-dag/v6(读者子
  # 报告证据档位);blocking 让空 evidence_refs / 空覆盖矩阵在落盘时被
  # discriminator.failed 替换并走返工,report_evidence_gate 兜住 schema
  # 之外的报告内容缺证据面。
  verification:
    event_schema:
      mode: blocking
    report_evidence_gate: fail_closed
  workflow:
    execution_profiles:
      bounded-direct-v1:
        strategy: direct
        limits:
          timeout_seconds: 900
          max_usage_samples: 60
          token_budget: 1500000
          cost_budget_usd: 8
    run_limits:
      timeout_seconds: 0
      token_budget: 10000000
      cost_budget_usd: 40
    candidate_quality_source: task_contract_required
    impl_self_check_required: true
    strict_triggers:
      rework_attempts_gte: 2
    work_units:
      enabled: true
      split_quality:
        mode: blocking
        max_acceptance_criteria: 8
---
apiVersion: zaofu.dev/v1
kind: ConfigProfile
metadata:
  name: kanban-collaboration/v1
spec:
  roles:
    - name: research_root
      instance_id: research_root
      role_kind: reader
      backend: claude-code
      permission_mode: allowlist
      allowed_tools: [Read, Glob, Grep, WebSearch, WebFetch, Agent, "Bash(zf emit *)"]
      transport: tmux
      lifecycle: {mode: on_demand}
      stuck_threshold_seconds: 900
      spawn_ready_timeout_seconds: 240
      budget_usd: 25
      provider_session:
        effort: high
      skills:
        - source-verification
        - zf-project-suggest
        - zf-research-adaptive-root
    - &research_reader
      name: source_researcher
      instance_id: source_researcher
      role_kind: reader
      backend: claude-code
      permission_mode: allowlist
      allowed_tools: [Read, Glob, Grep, WebSearch, WebFetch, "Bash(zf emit *)"]
      transport: tmux
      lifecycle: {mode: on_demand}
      stuck_threshold_seconds: 900
      spawn_ready_timeout_seconds: 240
      skills: [source-verification, zf-project-suggest]
    - <<: *research_reader
      name: product_analyst
      instance_id: product_analyst
      skills: [zf-project-suggest]
    - <<: *research_reader
      name: technical_analyst
      instance_id: technical_analyst
      skills: [source-verification, zf-cr]
    - <<: *research_reader
      name: risk_critic
      instance_id: risk_critic
      skills: [zf-yoke-critic-role-context]
    - <<: *research_reader
      name: synthesizer
      instance_id: synthesizer
      skills: [zf-project-suggest]
  workflow:
    stages:
      - id: research-adaptive
        trigger: workflow.invoke.requested
        topology: fanout_reader
        roles: [research_root]
        criteria:
          instructions:
            - This is an explicit provider-native read-only pilot, not a production capability declaration.
            - The research_root may use zero to four provider-native Explore subagents at depth one, must join every child, and remains the only ZaoFu protocol actor.
            - Children must not call zf, mutate runtime state, write project files, create canonical Tasks, or spawn further children.
            - Preserve source citations, contradictory evidence, open questions, child provenance, settlement, usage, and cost in the root report.
        fanout:
          children:
            - role_instance: research_root
              payload:
                child_id: research_root
                instruction: Run the bounded adaptive Research root operation and return one complete evidence-backed report.
                provider_native_access: read_only
                provider_native_max_children: 4
                provider_native_max_depth: 1
        aggregate:
          mode: wait_for_all
          child_success_event: research.child.completed
          child_failure_event: research.child.failed
          success_event: research.adaptive.completed
          failure_event: research.adaptive.failed
        timeout_seconds: 1500
      - id: research-fanout
        trigger: workflow.invoke.requested
        topology: fanout_reader
        roles:
          - source_researcher
          - product_analyst
          - technical_analyst
          - risk_critic
          - synthesizer
        fanout:
          children:
            - role_instance: source_researcher
              payload: {child_id: source_researcher}
            - role_instance: product_analyst
              payload: {child_id: product_analyst}
            - role_instance: technical_analyst
              payload: {child_id: technical_analyst}
            - role_instance: risk_critic
              payload: {child_id: risk_critic}
        aggregate:
          mode: wait_for_all
          child_success_event: research.child.completed
          child_failure_event: research.child.failed
          synth_role: synthesizer
          success_event: research.fanout.completed
          failure_event: research.fanout.failed
        timeout_seconds: 1800
---
apiVersion: zaofu.dev/v1
kind: ConfigProfile
metadata:
  name: refactor-controller-runtime/v3
spec:
  goal:
    enabled: true
    max_rescans: 5
    idle_progress_ticks: 3
    rework_fingerprint: true
    quiescent_after_escalate: true
    micro_loop: false
  # 2026-07-08 起只用仓内两目录:skills/(zf-* 边界/合约技能,本 source)
  # + yoke/(方法论族,经 wrapper dependencies 闭包或 bundle 直名走
  # yoke overlay 解析,无需声明 source)。外部 agent-skills 基线已 1v1
  # 核实由 yoke 族与 kernel 机械化覆盖后退役。
  skill_sources:
  - {name: zaofu-skills, path: ../../../skills, mode: readonly}
  flow_defaults:
    # bundle 组成同 prod-runtime/v1(2026-07-08 1v1 切换后):zf-* +
    # 角色 wrapper + flow/project delta；机械合同经 dependency closure 按需加载。
    refactor:
      roleDefaults:
        permission_mode: bypass
        stuck_threshold_seconds: 900
        spawn_ready_timeout_seconds: 240
        execution:
          default_profile: bounded-direct-v1
          profile_allowlist: [bounded-direct-v1]
        lifecycle:
          mode: on_demand
      roleSkillBundles:
        scan-contract: [source-verification, context-hygiene, zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-refactor-plan-synth, zf-harness-spec-freeze-contract, zf-harness-evidence-collection, zf-yoke-planner-role-context]
        scan-runtime: [source-verification, context-hygiene, zf-harness-evidence-collection]
        scan-verification: [zf-yoke-test-evaluator-role-context]
        refactor-plan-synth: [zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-refactor-plan-synth, zf-yoke-planner-role-context]
        plan-critic: [zf-workflow-adaptation-boundary, zf-yoke-critic-role-context]
        refactor-verify-bridge: [zf-verify-rescan-replan, zf-goal-closure-replan-contract, zf-yoke-test-evaluator-role-context]
        module-parity-scan: [source-verification, zf-verify-rescan-replan, zf-goal-closure-replan-contract, zf-yoke-test-evaluator-role-context]
        judge-refactor: [zf-goal-closure-judge-contract]
        impl: [zf-yoke-dev-worker-role-context]
        verify: [zf-workflow-adaptation-boundary, zf-project-adapter-matrix-enrichment, zf-yoke-test-evaluator-role-context]
  runtime:
    skills:
      # 2026-07-08:同 prod-runtime/v1——prod 预设 fail-closed。
      strict: true
      materialize: copy
    workdirs:
      enabled: true
      mode: worktree
    run_manager:
      backend: codex
      resident_agent:
        enabled: true
        session_mode: dedicated
    autoresearch_resident:
      enabled: true
      interval_seconds: 10
      max_actions_per_tick: 1
    feishu_inbound:
      enabled: ${ZF_FEISHU_INBOUND_ENABLED:-false}
      mode: bridge
      require_routing: true
  # 2026-07-08 LB-4 执法档(同 prod-runtime/v1)。
  verification:
    event_schema:
      mode: blocking
    report_evidence_gate: fail_closed
  workflow:
    execution_profiles:
      bounded-direct-v1:
        strategy: direct
        limits:
          timeout_seconds: 900
          max_usage_samples: 60
          token_budget: 1500000
          cost_budget_usd: 8
    run_limits:
      timeout_seconds: 0
      token_budget: 10000000
      cost_budget_usd: 40
    plan_approval: false
    candidate_quality_source: task_contract_required
    impl_self_check_required: true
    strict_triggers:
      rework_attempts_gte: 2
    admission_replan:
      enabled: true
      resynth_trigger: zaofu.refactor.review.ready
    work_units:
      enabled: true
      split_quality:
        mode: blocking
        max_scope_files: 12
        max_acceptance_criteria: 8
        require_validation_surface: true
---
apiVersion: zaofu.dev/v1
kind: RoleSet
metadata:
  name: issue-codex-lanes/v1
spec:
  backend: codex
  lanes: 1
  stages:
    fix:
      role_pattern: fix-lane-{lane}
    verify:
      role_pattern: verify-lane-{lane}
---
apiVersion: zaofu.dev/v1
kind: RoleSet
metadata:
  name: prd-codex-lanes/v1
spec:
  backend: codex
  lanes: 2
  stages:
    impl:
      role_pattern: dev-lane-{lane}
    verify:
      role_pattern: verify-lane-{lane}
