function inlineMarkdown(text){
 let s=E(text);const codes=[];s=s.replace(/`([^`]+)`/g,(_,v)=>{codes.push(`<code>${v}</code>`);return `\u0001${codes.length-1}\u0001`;});
 s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
 return s.replace(/\u0001(\d+)\u0001/g,(_,i)=>codes[Number(i)]||'');
}
function markdown(text){
 const lines=String(text).replace(/\r/g,'').split('\n');let html='',list='',inCode=false,code=[];
 const closeList=()=>{if(list){html+=`</${list}>`;list='';}};
 for(const line of lines){if(line.trim().startsWith('```')){closeList();if(inCode){html+=`<pre><code>${E(code.join('\n'))}</code></pre>`;code=[];}inCode=!inCode;continue;}if(inCode){code.push(line);continue;}
 const heading=line.match(/^(#{1,3})\s+(.*)$/);const bullet=line.match(/^\s*[-*]\s+(.*)$/);const ordered=line.match(/^\s*\d+\.\s+(.*)$/);
 if(heading){closeList();const n=heading[1].length;html+=`<h${n}>${inlineMarkdown(heading[2])}</h${n}>`;}
 else if(bullet||ordered){const t=bullet?'ul':'ol';if(list!==t){closeList();list=t;html+=`<${t}>`;}html+=`<li>${inlineMarkdown((bullet||ordered)[1])}</li>`;}
 else{closeList();if(line.startsWith('> '))html+=`<blockquote>${inlineMarkdown(line.slice(2))}</blockquote>`;else if(line.trim())html+=`<p>${inlineMarkdown(line)}</p>`;}}
 closeList();if(inCode)html+=`<pre><code>${E(code.join('\n'))}</code></pre>`;return html;
}

}
function pauseRun(notify=true){

 const now=performance.now();r.total+=now-r.started;const step=r.steps[r.index];step.elapsed+=now-step.started;step.status='paused';r.status='paused';

function resumeRun(){

function pauseAtFailure(r,mode){

 S.publication.state=mode==='unknown'?'outcome_unknown':mode==='partial'?'partially_published':'publish_failed';
 if(mode==='unknown'){S.publication.issueNumber=128;step.output=JSON.stringify({demo:true,status:'response_timeout',outcome:'unknown',next_action:'check_existing_issue',create_new_issue:false},null,2);}
 if(mode==='partial')step.output=JSON.stringify({demo:true,issue_number:128,status:'evidence_comment_failed',retry_scope:'evidence_and_remaining_steps',create_new_issue:false},null,2);
 if(mode==='failure')step.output=JSON.stringify({demo:true,status:'connection_failed',issue_created:false,retry_from:'repository_preflight'},null,2);
 render();announce(mode==='unknown'?'Publication outcome is unknown. Check the existing issue before retrying.':mode==='partial'?'The issue exists, but the evidence comment needs attention.':'The connection failed before issue creation.');

function tick(){
 const r=S.run;if(r?.status==='running'){
  const step=r.steps[r.index];if(stepElapsed(r,step)>=step.ms){
   if(r.type==='publish'&&!r.context.failureConsumed){const sc=r.context.scenario||S.scenario;if((sc==='failure'&&r.index===2)||(sc==='unknown'&&r.index===3)||(sc==='partial'&&r.index===4)){pauseAtFailure(r,sc);updateTimers();return;}}
   const now=performance.now();step.elapsed+=now-step.started;step.status='completed';
   if(r.type==='publish'&&r.index===3)S.publication.issueNumber=128;
   if(r.index===r.steps.length-1){r.total+=now-r.started;finishRun(r);}
   else{r.index++;r.steps[r.index].status='running';r.steps[r.index].started=now;render(true);announce(r.steps[r.index].title);}
  }
 }
 updateTimers();
}
function updateTimers(){

 const complete=r.steps.filter(s=>s.status==='completed').length;const fraction=r.status==='completed'?1:Math.min(1,(complete+Math.min(.96,stepElapsed(r,r.steps[r.index])/r.steps[r.index].ms))/r.steps.length);
 $$('[data-progress-fill]').forEach(el=>el.style.transform=`scaleX(${fraction})`);$$('[data-progressbar]').forEach(el=>el.setAttribute('aria-valuenow',String(Math.round(fraction*100))));
 if(r.type==='publish'&&r.index===4&&r.status==='running'){const n=Math.min(countAttachments(),Math.floor(stepElapsed(r,r.steps[4])/r.steps[4].ms*countAttachments()));$$('[data-evidence-progress]').forEach(el=>el.textContent=`${n} / ${countAttachments()} evidence items`);}}
 if(S.saving)$$('[data-save-time]').forEach(el=>el.textContent=clock(performance.now()-S.saveStarted));

function controls(){
 const configs=[['success','circle-check','Success'],['auth','key-round','Authorization'],['failure','globe','Connection error'],['unknown','search','Unknown outcome'],['partial','paperclip','Evidence error']];
 openModal('controls','Demo controls','',`<h3 class="dialog-section-title">Stage</h3><div class="stage-jumps">${STAGES.map(s=>button(s.title,'demo-jump','small-btn','',false,`data-stage="${s.id}"`)).join('')}${button('Published','seed-published','small-btn')}</div><div class="divider"></div><h3 class="dialog-section-title">Publication</h3><div class="scenario-grid">${configs.map(([id,glyph,title])=>`<button type="button" class="scenario-button ${S.scenario===id?'active':''}" data-act="set-scenario" data-scenario="${id}" aria-pressed="${S.scenario===id}">${icon(glyph)}<strong>${title}</strong><span class="circle-select" aria-hidden="true"></span></button>`).join('')}</div><div class="divider"></div><label class="segmented-label">Speed</label><div class="tabbar" role="group" aria-label="Simulation speed">${[1,2,4].map(n=>`<button type="button" class="tab ${S.speed===n?'active':''}" data-act="set-speed" data-speed="${n}" aria-pressed="${S.speed===n}">${n}×</button>`).join('')}</div>`,button('Reset','restart-demo','','rotate-ccw')+button('Done','close-modal','primary'),'drawer');
}
function seedPublished(){
 if(S.run?.status==='running')pauseRun(false);if(!S.comparison)seedComparison();if(!S.draft)materializeDraft();saveDraftNow();S.preview={title:S.draft.title,body:S.draft.body,revision:S.draft.revision,sourceVersion:S.draft.sourceVersion,attachmentIds:[...S.attachmentIds],createdAt:Date.now()};
 S.publication={state:'published',snapshot:clone(S.preview),createdAt:Date.now()-16300,completedAt:Date.now(),issueNumber:128,attempt:1,elapsed:16300};STAGES.forEach(x=>S.completed.add(x.id));S.stage='publish';persist();closeModal();render();$('#stage-scroll').scrollTop=0;toast('Published state loaded.','monitor');
}
function resetDemo(){
 clearTimeout(S.saveTimer);S.run=null;try{localStorage.removeItem(STORAGE);}catch{}
 Object.assign(S,{stage:'investigate',completed:new Set(),runs:{},run:null,reports:[{version:1,fields:clone(BASE_FIELDS),createdAt:Date.now()}],activeReport:0,selected:new Set(),notes:{},guidance:'',reviewFilter:'all',search:'',comparison:null,draft:null,draftHistory:[],saving:false,saveError:'',validationError:'',attachmentIds:new Set(EVIDENCE.map(x=>x.id)),excludedAck:false,consent:false,preview:null,publication:null,connected:true,expanded:new Set(),diffFilter:'all',diffLayout:'split'});
 closeModal();startRun('analysis',initialSteps());$('#stage-scroll').scrollTop=0;toast('A fresh demo investigation has started.','refresh-cw');
}

// Event delegation keeps controls intact when the live execution pane updates.
function invalidatePreview(){S.preview=null;S.consent=false;S.excludedAck=false;}
function updateManifest(){
 $$('[data-evidence-id]').forEach(el=>{const selected=S.attachmentIds.has(el.dataset.evidenceId);el.checked=selected;el.closest('.attachment-card')?.classList.toggle('selected',selected);});
 $$('[data-manifest-count]').forEach(el=>el.textContent=`${S.attachmentIds.size} selected`);
 const all=$('#all-evidence');if(all){all.checked=S.attachmentIds.size===EVIDENCE.length;all.indeterminate=S.attachmentIds.size>0&&S.attachmentIds.size<EVIDENCE.length;}
}
function exportLog(){
 const logs=Object.values(S.runs).map(r=>({id:r.id,type:r.type,status:r.status,active_time_ms:Math.round(runElapsed(r)),created_at:new Date(r.createdAt).toISOString(),steps:r.steps.map(s=>({action:s.title,phase:s.phase,tool:s.tool,status:s.status,active_time_ms:Math.round(stepElapsed(r,s)),command:s.command,complete_output:s.output}))}));
 emitDownload(JSON.stringify({prototype:true,network_requests_sent:false,session:'demo-issue-046',source_revision:REVISION,runs:logs,publication:S.publication?.state||'not_started'},null,2),'zaofu-issue-demo-execution-log.json','application/json');toast('Log exported.','download');
}
function exportDraft(published=false){const d=published?S.publication?.snapshot:S.draft;if(!d){toast('Create a draft first.','info');return;}emitDownload(`# ${d.title}\n\n${d.body}`,published?'zaofu-issue-128-local-demo.md':`zaofu-issue-draft-v${d.revision}.md`,'text/markdown');toast('Exported.','download');}
function formatEditor(kind){
 if(payloadLocked())return;const el=$('#draft-body');if(!el)return;
 const start=el.selectionStart,end=el.selectionEnd,selected=el.value.slice(start,end);let replacement=selected;
 if(kind==='heading')replacement='## '+(selected||'Section heading');
 if(kind==='bold')replacement='**'+(selected||'Bold text')+'**';
 if(kind==='italic')replacement='*'+(selected||'Italic text')+'*';
 if(kind==='list')replacement=(selected||'List item').split('\n').map(l=>'- '+l).join('\n');
 if(kind==='code')replacement='```text\n'+(selected||'Code or command')+'\n```';
 if(kind==='link')replacement='['+(selected||'Link text')+'](https://example.com)';
 el.setRangeText(replacement,start,end,'select');el.focus();S.draft.body=el.value;scheduleSave();
}
function restoreDraftVersion(version){
 if(payloadLocked())return;const found=S.draftHistory.find(x=>x.revision===version);if(!found)return;
 saveDraftNow();S.draft={...clone(found),revision:(S.draft?.revision||0)+1,savedAt:Date.now()};S.draftHistory.push(clone(S.draft));invalidatePreview();S.validationError='';persist();closeModal();S.stage='draft';render();toast(`Restored as v${S.draft.revision}.`,'rotate-ccw');
}
function showEvidence(id){
 const f=EVIDENCE.find(x=>x.id===id);if(!f)return;
 openModal('evidence-file',E(f.name),'A local demonstration snapshot, not an uploaded source file.',`<span class="checksum">SHA-256<br>${f.sha}</span><pre class="evidence-content">${E(f.content)}</pre>`,button('Back to issue','view-published')+button('Export snapshot','export-evidence','primary','download',false,`data-id="${f.id}"`),'wide');
}
function requestReset(){openModal('reset','Reset this demo?','',`<p class="small muted">Your local draft and history will be cleared.</p>`,button('Cancel','close-modal')+(S.draft?button('Export','export-draft','','download'):'')+button('Reset','confirm-reset','primary','rotate-ccw'));}
function toggleOutput(b){
 const r=currentRun();if(!r)return;const s=r.steps[Number(b.dataset.index)];if(!s)return;
 const key=b.dataset.key,kind=b.dataset.kind,open=!S.expanded.has(key);if(open)S.expanded.add(key);else S.expanded.delete(key);
 b.setAttribute('aria-expanded',String(open));const target=document.getElementById(b.getAttribute('aria-controls'));
 if(target){target.hidden=!open;target.innerHTML=open?outputBox(kind==='command'?s.command:s.output,kind==='command'?'Command':'Full simulated output',Number(b.dataset.index),kind):'';}
}
function selectReport(index){if(!S.reports[index])return;S.activeReport=index;S.selected.clear();render(true);toast(`Report v${report().version} selected.`,'file-text');}
function handleAction(b){
 const a=b.dataset.act;if(!a||a==='noop'||b.disabled)return;
 switch(a){
 case 'nav':go(b.dataset.stage);break;
 case 'demo-jump':closeModal();go(b.dataset.stage);break;
 case 'controls':controls();break;
 case 'session-context':openModal('session','Session','',contextPanel(S.runs.analysis),button('Done','close-modal','primary'));break;
 case 'field-details':{const open=!S.expanded.has(b.dataset.key);open?S.expanded.add(b.dataset.key):S.expanded.delete(b.dataset.key);b.setAttribute('aria-expanded',String(open));const detail=document.getElementById(b.getAttribute('aria-controls'));if(detail)detail.hidden=!open;break;}
 case 'restart-demo':requestReset();break;
 case 'confirm-reset':resetDemo();break;
 case 'restart-analysis':S.completed.delete('investigate');startRun('analysis',initialSteps());toast('Investigation started.','refresh-cw');break;
 case 'pause-run':pauseRun();break;
 case 'resume-run':resumeRun();break;
 case 'export-log':exportLog();break;
 case 'close-toast':b.closest('.toast')?.remove();break;
 case 'close-modal':closeModal();break;
 case 'toggle-output':toggleOutput(b);break;
 case 'copy-output':{const r=currentRun(),s=r?.steps[Number(b.dataset.index)];if(s)copyText(b.dataset.kind==='command'?s.command:s.output);break;}
 case 'to-review':go('review');break;
 case 'to-compare':go('compare');break;
 case 'to-draft':go('draft');break;
 case 'to-preview':go('preview');break;
 case 'to-publish':go('publish');break;
 case 'review-filter':S.reviewFilter=b.dataset.filter;render(true);break;
 case 'reset-filter':S.reviewFilter='all';S.search='';render(true);break;
 case 'clear-selection':if(!payloadLocked()){S.selected.clear();updateSelection();}break;
 case 'remove-field':if(!payloadLocked()){S.selected.delete(b.dataset.field);updateSelection();}break;
 case 'reanalyze':launchReanalysis();break;
 case 'create-draft':
  if(payloadLocked())break;
  if(S.draft)openModal('new-draft','Generate a new draft?','The current draft will remain in revision history.',`<p class="small muted">Use Report v${report().version}. Current edits remain in history.</p>`,button('Cancel','close-modal')+button('Generate','actual-create-draft','primary','file-text'));
  else launchDraft();break;
 case 'actual-create-draft':closeModal();launchDraft();break;
 case 'generate-preview':launchPreview();break;
 case 'report-menu':{const m=$('#report-menu');if(m){m.hidden=!m.hidden;b.setAttribute('aria-expanded',String(!m.hidden));}break;}
 case 'choose-report':selectReport(Number(b.dataset.index));break;
 case 'previous-report':viewReport(S.runs.reanalysis?.context.baseIndex??0);break;
 case 'report-history':reportHistory();break;
 case 'view-report':viewReport(Number(b.dataset.index));break;
 case 'diff-filter':S.diffFilter=b.dataset.filter;render(true);break;
 case 'show-all-diff':S.diffFilter='all';render(true);break;
 case 'diff-split':S.diffLayout='split';render(true);break;
 case 'diff-unified':S.diffLayout='unified';render(true);break;
 case 'toggle-draft-source':if(!payloadLocked()){S.activeReport=S.activeReport===0?S.reports.findIndex(r=>r.version===S.comparison.after.version):0;render(true);toast(`Draft source: v${report().version}.`,'file-text');}break;
 case 'draft-history':draftHistory();break;
 case 'view-draft-version':viewDraftVersion(Number(b.dataset.version));break;
 case 'restore-draft':restoreDraftVersion(Number(b.dataset.version));break;
 case 'format-heading':case 'format-bold':case 'format-italic':case 'format-list':case 'format-code':case 'format-link':formatEditor(a.slice(7));break;
 case 'export-draft':exportDraft(false);break;
 case 'export-published':exportDraft(true);break;
 case 'attachments':attachmentModal();break;
 case 'exclusions':attachmentModal('excluded');break;
 case 'attachments-tab':attachmentModal(b.dataset.tab);break;
 case 'export-evidence':{const f=EVIDENCE.find(x=>x.id===b.dataset.id);if(f){emitDownload(f.content,f.name);toast('Demo snapshot exported.','download');}break;}
 case 'view-evidence':showEvidence(b.dataset.id);break;
 case 'confirm-publish':confirmPublish();break;
 case 'begin-publish':beginPublishing();break;
 case 'authorize':authorizationModal();break;
 case 'complete-auth':
  if(!S.publication||S.publication.state!=='authorization_required')break;
  closeModal();S.connected=true;S.publication.state='publishing';S.stage='publish';startRun('publish',publicationSteps(),{failureConsumed:false,scenario:'auth'});toast('Connected. Publishing.','key-round');break;
 case 'back-from-auth':S.publication=null;S.consent=false;go('preview');break;
 case 'recover-publish':recoverPublishing();break;
 case 'retry-edit':S.publication=null;S.consent=false;if(S.run?.type==='publish')S.run=null;go('preview');break;
 case 'view-published':viewPublished();break;
 case 'copy-reference':copyText(`${REPOSITORY}#128 (local demo; no external issue)`);break;
 case 'publication-log':{const r=S.runs.publish;openModal('publication-log','Publication activity','The local demonstration receipt and full simulated activity.',r?activityList(r,{title:'Publication log',round:'GitHub'}):statusNote('Published-state fixture','This state was loaded with a demo shortcut. No timed publication run was performed.','','monitor'),button('Close','close-modal')+button('Export log','export-log','primary','download'),'wide');break;}
 case 'set-scenario':S.scenario=b.dataset.scenario;if(scenarioNames[S.scenario])controls();break;
 case 'set-speed':{const n=Number(b.dataset.speed);if([1,2,4].includes(n)){S.speed=n;controls();}break;}
 case 'seed-published':seedPublished();break;
 default:console.warn('Unrecognized prototype action:',a);
 }
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(b)handleAction(b);
 const menu=$('#report-menu');if(menu&&!menu.hidden&&!e.target.closest('.report-select')){if(b?.dataset.act!=='report-menu'){menu.hidden=true;$('[data-act="report-menu"]')?.setAttribute('aria-expanded','false');}}
 if(e.target===$('#modal'))closeModal();
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.matches('[data-field-note]')){if(!payloadLocked())S.notes[el.dataset.fieldNote]=el.value;return;}
 if(el.id==='general-guidance'){if(!payloadLocked())S.guidance=el.value;return;}
 if(el.id==='field-search'){S.search=el.value;render(true);return;}
 if((el.id==='draft-title'||el.id==='draft-body')&&S.draft&&!payloadLocked()){
  S.draft[el.id==='draft-title'?'title':'body']=el.value;scheduleSave();const err=$('#draft-validation');if(err)err.hidden=true;
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.matches('[data-field-select]')){if(payloadLocked())return;el.checked?S.selected.add(el.dataset.fieldSelect):S.selected.delete(el.dataset.fieldSelect);updateSelection();}
 if(el.id==='select-all'){if(payloadLocked())return;filteredFields().forEach(f=>el.checked?S.selected.add(f.id):S.selected.delete(f.id));updateSelection();}
 if(el.id==='ack-exclusions'){S.excludedAck=el.checked;updateFooter();}
 if(el.id==='publication-consent'){S.consent=el.checked;updateFooter();}
 if(el.matches('[data-evidence-id]')){if(payloadLocked())return;el.checked?S.attachmentIds.add(el.dataset.evidenceId):S.attachmentIds.delete(el.dataset.evidenceId);invalidatePreview();updateManifest();persist();}
 if(el.id==='all-evidence'){if(payloadLocked())return;S.attachmentIds=el.checked?new Set(EVIDENCE.map(x=>x.id)):new Set();invalidatePreview();updateManifest();persist();}
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&S.stage==='draft'&&S.draft){e.preventDefault();saveDraftNow();toast(payloadLocked()?'This snapshot is read-only.':'Saved.','file-text');}
});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal();});
window.addEventListener('beforeunload',()=>{if(S.draft){saveDraftNow();persist();}});

if(restore()){render();toast('Draft restored.','file-text');}
else startRun('analysis',initialSteps());
setInterval(tick,100);
if(location.hash){const stage=location.hash.slice(1);if(stage==='published')seedPublished();else if(STAGES.some(x=>x.id===stage))go(stage);}
</script>
</body>
</html>
