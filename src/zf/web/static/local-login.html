<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录本地工作区 · ZaoFu</title>
<style>
@font-face {
  font-family:Geist; font-style:normal; font-weight:100 900; font-display:swap;
  src:url("/auth/local/geist-latin.woff2") format("woff2");
}
:root {
  color-scheme:light dark;
  --bg:light-dark(#fbfaf8,#1a1a19); --text:light-dark(#1d1c1a,#eceae5);
  --field:light-dark(#fff,#1d1d1c); --border:light-dark(#dad7d0,#3a3936);
  --accent:light-dark(#4b5bd6,#8e9af3); --on-accent:light-dark(#fff,#12131c);
}
* { box-sizing:border-box }
body {
  margin:0; min-height:100dvh; background:var(--bg); color:var(--text);
  font:13.5px/1.45 Geist,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; font-feature-settings:"ss01","cv11";
}
header { padding:18px 24px; font-size:14.5px; font-weight:600; letter-spacing:-.01em }
main { width:min(380px,calc(100% - 32px)); margin:6vh auto 40px }
h1 { margin:0 0 16px; text-align:center; font-size:23px; font-weight:600; letter-spacing:-.022em }
form { display:grid; gap:16px }
label { display:grid; gap:6px; font-size:12.5px; font-weight:500 }
input,button { width:100%; height:36px; border-radius:6px; font:inherit; font-size:13.5px }
input { padding:0 10px; border:1px solid var(--border); background:var(--field); color:inherit; font-weight:400 }
input:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent); outline:none }
button {
  padding:0 14px; border:1px solid transparent; background:var(--accent); color:var(--on-accent);
  box-shadow:inset 0 -1px #0000001f; font-weight:500; cursor:pointer;
  transition:background .14s, transform .14s;
}
button:hover { background:color-mix(in srgb,var(--accent) 88%,var(--text)) }
button:active { background:color-mix(in srgb,var(--accent) 78%,var(--text)); transform:scale(.97) }
button:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
button:disabled { opacity:.45; box-shadow:none; pointer-events:none }
@media (prefers-reduced-motion:reduce) { button,button:active { transition:none; transform:none } }
[role=alert] { color:light-dark(#b23c30,#e57d70); font-size:12.5px; margin:0 }
[role=alert]:empty { display:none }
</style></head>
<body>
<header>ZaoFu</header>
<main>
  <h1>登录本地工作区</h1>
  <form method="post" action="/auth/local/login">
    <label>用户名<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <p role="alert" aria-live="polite"></p>
    <button type="submit">登录</button>
  </form>
</main>
<script>
const form = document.querySelector("form");
form.addEventListener("submit", async event => {
  event.preventDefault();
  const button = form.querySelector("button"), error = form.querySelector("[role=alert]");
  button.disabled = true;
  error.textContent = "";
  try {
    const response = await fetch(form.action, {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify(Object.fromEntries(new FormData(form)))
    });
    if (response.ok) location.reload();
    else error.textContent = (await response.json()).error || "登录失败，请重试。";
  } catch { error.textContent = "连接失败，请重试。"; }
  finally { button.disabled = false; }
});
</script></body></html>
