[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zaofu"
version = "0.0.7"
description = "ZaoFu multi-agent harness scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "httpx>=0.25",
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8",
    "hypothesis>=6.100",
    "schemathesis>=4.26,<5",
    "ruff>=0.16.0",
]
stream-json = ["claude-code-sdk>=0.0.25"]
# F-WEB-MVP-01: thin local Web dashboard (zf web). Optional install:
#   pip install -e ".[web]"
# Adds FastAPI + uvicorn + WebSocket transport. Not part of base zaofu install.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "websockets>=13"]
# doc 99 §4.1: in-process Feishu WS bridge (`zf feishu bridge --watch`). Optional:
#   pip install -e ".[feishu]"
# Adds the official lark-oapi SDK for the WS long-connection. Not part of base.
feishu = ["lark-oapi>=1.4"]

[project.scripts]
zf = "zf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".hypothesis", "tests/e2e/fixtures"]
addopts = "--cov=zf --cov-report=term-missing -m 'not perf and not host and not real_provider'"
asyncio_mode = "auto"
markers = [
    "host: host capability, local archive, or installed CLI sensor",
    "mock_e2e: deterministic mock end-to-end workflow proof",
    "perf: opt-in performance budget smoke (run: pytest -m perf)",
    "real_provider: explicit real Claude/Codex provider exercise",
    "serial: process or fixed-resource test that must not run under xdist",
    "integration: tests requiring external protocols, Docker, or a long-lived process",
]

[tool.ruff]
target-version = "py311"
exclude = ["tests/e2e/fixtures"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
