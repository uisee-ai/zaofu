apiVersion: zaofu.dev/v1
kind: ConfigProfile
metadata:
  name: flow-project-runtime/v1
spec:
  runtime:
    workdirs:
      enabled: true
      mode: worktree
    run_manager:
      backend: codex
      resident_agent:
        enabled: true
        session_mode: dedicated
    autoresearch_resident:
      enabled: true
      interval_seconds: 10
      max_actions_per_tick: 1
    feishu_inbound:
      enabled: ${ZF_FEISHU_INBOUND_ENABLED:-false}
      mode: bridge
      require_routing: true
  workflow:
    candidate_quality_source: task_contract_required
    impl_self_check_required: true
    rework_routing: {}
    work_units:
      enabled: true
      split_quality:
        mode: blocking
        max_acceptance_criteria: 0
  flow_defaults:
    issue:
      roleSkillBundles:
        issue-triage:
        - debugging-triage
        - source-verification
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-issue-plan-synth
        - zf-yoke-planner-role-context
        plan-critic:
        - zf-workflow-adaptation-boundary
        - zf-yoke-critic-role-context
        discovery:
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        judge-issue:
        - zf-goal-closure-judge-contract
        fix:
        - zf-yoke-dev-worker-role-context
        verify:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-yoke-test-evaluator-role-context
    prd:
      roleSkillBundles:
        scan:
        - source-verification
        - context-hygiene
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-prd-plan-synth
        - zf-yoke-planner-role-context
        planner:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-prd-plan-synth
        - zf-yoke-planner-role-context
        plan-critic:
        - zf-workflow-adaptation-boundary
        - zf-yoke-critic-role-context
        discovery:
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        judge-prd:
        - zf-goal-closure-judge-contract
        impl:
        - zf-yoke-dev-worker-role-context
        verify:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-yoke-test-evaluator-role-context
    refactor:
      roleSkillBundles:
        scan-contract:
        - source-verification
        - context-hygiene
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-refactor-plan-synth
        - zf-harness-spec-freeze-contract
        - zf-harness-evidence-collection
        - zf-yoke-planner-role-context
        scan-runtime:
        - source-verification
        - context-hygiene
        - zf-harness-evidence-collection
        scan-verification:
        - zf-yoke-test-evaluator-role-context
        refactor-plan-synth:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-refactor-plan-synth
        - zf-yoke-planner-role-context
        plan-critic:
        - zf-workflow-adaptation-boundary
        - zf-yoke-critic-role-context
        refactor-verify-bridge:
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        module-parity-scan:
        - source-verification
        - zf-verify-rescan-replan
        - zf-goal-closure-replan-contract
        - zf-yoke-test-evaluator-role-context
        judge-refactor:
        - zf-goal-closure-judge-contract
        impl:
        - zf-yoke-dev-worker-role-context
        verify:
        - zf-workflow-adaptation-boundary
        - zf-project-adapter-matrix-enrichment
        - zf-yoke-test-evaluator-role-context
---
apiVersion: zaofu.dev/v1
kind: ZfConfig
metadata:
  name: ty
spec:
  version: '1.0'
  project:
    name: ty
    state_dir: .zf-ty
  session:
    tmux_session: ${ZF_TMUX_SESSION:-zf-ty}
  orchestrator:
    backend: codex
    wake_min_interval_s: 5
  roles:
  - name: orchestrator
    instance_id: orchestrator
    role_kind: reader
    backend: codex
    permission_mode: bypass
    transport: tmux
    stuck_threshold_seconds: 900
    spawn_ready_timeout_seconds: 240
    triggers:
    - dispatch.silent_stall
    - orchestrator.rework.triage.requested
    - orchestrator.semantic.checkpoint.requested
    publishes:
    - orchestrator.rework.triage.recorded
    skills:
    - zf-yoke-orchestrator-role-context
    - zf-harness-state-sync
  workflow:
    orchestration:
      mode: exception_advisor
      flow_policies:
        issue:
          mode: exception_advisor
        prd:
          mode: semantic_control
          checkpoints:
          - plan_candidate
          checkpoint_policies:
            plan_candidate: shadow
        refactor:
          mode: semantic_control
          checkpoints:
          - plan_candidate
          checkpoint_policies:
            plan_candidate: shadow
        workflow:
          mode: exception_advisor
        research:
          mode: exception_advisor
    plan_approval: true
  uses:
  - flow-project-runtime/v1
  skill_sources:
  - name: zaofu-skills
    path: skills
    mode: readonly
